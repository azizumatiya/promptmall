  <script src="/_sdk/c6bcadf20ce5820f.editing_sdk.js" integrity="sha512-LVukVCTKnKSxy98w+wCVzDAxVXBG2vy32XblXlmJD9CPFnF2/FVc75CFngl41IdXcX3sVHJc9olw64zrPM/FIA=="></script>
  <script>
    const state = { records: [], sdkReady: false };
    const grid = document.getElementById('prompt-grid');
    const emptyState = document.getElementById('empty-state');
    const resultCount = document.getElementById('result-count');
    const searchInput = document.getElementById('prompt-search');
    const categoryFilter = document.getElementById('category-filter');
    const modelFilter = document.getElementById('model-filter');
    const sortFilter = document.getElementById('sort-filter');
    const drawer = document.getElementById('drawer');
    const veil = document.getElementById('veil');
    const toast = document.getElementById('toast');
    const formStatus = document.getElementById('form-status');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('status-show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('status-show'), 2500);
    }

    function openDrawer() {
      drawer.classList.add('drawer-open');
      veil.classList.add('veil-open');
      document.getElementById('entry-title').focus();
    }

    function closeDrawer() {
      drawer.classList.remove('drawer-open');
      veil.classList.remove('veil-open');
      formStatus.textContent = '';
    }

    function filteredRecords() {
      const query = searchInput.value.trim().toLowerCase();
      const category = categoryFilter.value;
      const model = modelFilter.value;
      const sort = sortFilter.value;

      const records = state.records.filter(record => {
        const searchable = [record.title, record.prompt_text, record.category, record.model].join(' ').toLowerCase();
        return (!query || searchable.includes(query)) &&
          (!category || record.category === category) &&
          (!model || record.model === model);
      });

      return records.sort((a, b) => {
        if (sort === 'top') return (b.likes || 0) - (a.likes || 0);
        if (sort === 'title') return (a.title || '').localeCompare(b.title || '');
        return new Date(b.created_at || 0) - new Date(a.created_at || 0);
      });
    }

    function createCard(record) {
      const fragment = document.getElementById('prompt-card-template').content.cloneNode(true);
      const card = fragment.querySelector('article');
      card.dataset.recordId = record.__backendId;
      updateCard(card, record);
      return card;
    }

    function updateCard(card, record) {
      const preview = card.querySelector('.preview');
      preview.style.backgroundImage = `url("${String(record.image_url || '').replace(/"/g, '%22')}")`;
      card.querySelector('[data-template-id="prompt-card-title"]').textContent = record.title || 'Untitled prompt';
      card.querySelector('[data-template-id="prompt-card-category"]').textContent = record.category || 'Other';
      card.querySelector('[data-template-id="prompt-card-model"]').textContent = record.model || 'AI model';
      card.querySelector('[data-template-id="prompt-card-copy"]').textContent = record.prompt_text || '';
      card.querySelector('.like-count').textContent = record.likes || 0;

      card.querySelector('[data-template-id="prompt-card-copy-button"]').onclick = async () => {
        try {
          await navigator.clipboard.writeText(record.prompt_text || '');
          showToast('Prompt copied to clipboard');
        } catch (error) {
          showToast('Could not copy this prompt');
        }
      };

      card.querySelector('[data-template-id="prompt-card-like-button"]').onclick = async (event) => {
        const button = event.currentTarget;
        if (!state.sdkReady) return;
        button.disabled = true;
        button.classList.add('opacity-60');
        const latest = state.records.find(item => item.__backendId === record.__backendId) || record;
        const result = await window.dataSdk.update({ ...latest, likes: (latest.likes || 0) + 1 });
        button.disabled = false;
        button.classList.remove('opacity-60');
        if (!result.isOk) showToast('Could not save your like. Please try again.');
      };
    }

    function renderGallery() {
      const records = filteredRecords();
      const currentCards = new Map([...grid.children].map(card => [card.dataset.recordId, card]));

      records.forEach(record => {
        const existing = currentCards.get(record.__backendId);
        if (existing) {
          updateCard(existing, record);
          currentCards.delete(record.__backendId);
        } else {
          grid.appendChild(createCard(record));
        }
      });

      currentCards.forEach(card => card.remove());
      records.forEach(record => {
        const card = grid.querySelector(`[data-record-id="${CSS.escape(record.__backendId)}"]`);
        if (card) grid.appendChild(card);
      });

      emptyState.classList.toggle('hidden', records.length !== 0);
      resultCount.textContent = `${records.length} ${records.length === 1 ? 'prompt' : 'prompts'}`;
      lucide.createIcons();
    }

    const handler = {
      onDataChanged(data) {
        state.records = data;
        renderGallery();
      }
    };

    async function initialiseGallery() {
      const result = await window.dataSdk.init(handler);
      if (result.isOk) {
        state.sdkReady = true;
      } else {
        formStatus.textContent = 'The gallery could not connect. Please refresh and try again.';
      }
    }

    document.getElementById('open-drawer').addEventListener('click', openDrawer);
    document.getElementById('close-drawer').addEventListener('click', closeDrawer);
    document.getElementById('cancel-entry').addEventListener('click', closeDrawer);
    veil.addEventListener('click', closeDrawer);

    [searchInput, categoryFilter, modelFilter, sortFilter].forEach(control => {
      control.addEventListener('input', renderGallery);
      control.addEventListener('change', renderGallery);
    });

    document.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        searchInput.focus();
      }
      if (event.key === 'Escape') closeDrawer();
    });

    document.getElementById('prompt-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (!state.sdkReady) {
        formStatus.textContent = 'Gallery is still connecting. Please try again in a moment.';
        return;
      }
      if (state.records.length >= 999) {
        formStatus.textContent = 'This gallery has reached its 999 prompt limit. Remove an entry before saving another.';
        return;
      }

      const submitButton = document.getElementById('save-entry');
      const imageUrl = document.getElementById('entry-image').value.trim();
      if (!/^https:\/\//i.test(imageUrl)) {
        formStatus.textContent = 'Please use an image link beginning with https://';
        return;
      }

      submitButton.disabled = true;
      submitButton.classList.add('opacity-60');
      formStatus.textContent = 'Saving your prompt…';

      const result = await window.dataSdk.create({
        title: document.getElementById('entry-title').value.trim(),
        image_url: imageUrl,
        prompt_text: document.getElementById('entry-prompt').value.trim(),
        category: document.getElementById('entry-category').value,
        model: document.getElementById('entry-model').value,
        likes: 0,
        created_at: new Date().toISOString()
      });

      submitButton.disabled = false;
      submitButton.classList.remove('opacity-60');

      if (result.isOk) {
        document.getElementById('prompt-form').reset();
        closeDrawer();
        showToast('Prompt saved to your gallery');
      } else {
        formStatus.textContent = 'Your prompt could not be saved. Please try again.';
      }
    });

    lucide.createIcons();
    initialiseGallery();
  </script>
 </body>
</html>
