<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROMPTIX — Next-Gen AI Prompt Hub</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 24, 38, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent: #ec4899;
      --accent-glow: rgba(236, 72, 153, 0.35);
      --pro-gold: #f59e0b;
      --pro-glow: rgba(245, 158, 11, 0.3);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glow Background Spheres */
    .glow-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
      animation: float 12s ease-in-out infinite alternate;
    }

    .glow-1 {
      top: -100px;
      left: -100px;
      width: 500px;
      height: 500px;
      background: var(--primary-glow);
    }

    .glow-2 {
      top: 40%;
      right: -150px;
      width: 600px;
      height: 600px;
      background: var(--accent-glow);
      animation-delay: -6s;
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(50px) scale(1.1); }
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
      position: relative;
      z-index: 1;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 0;
      border-bottom: 1px solid var(--card-border);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 30%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge-tag {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid var(--primary);
      color: #a5b4fc;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Costable Pro Switch */
    .mode-toggle {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.5rem 1rem;
      border-radius: 30px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
    }

    input:checked + .slider {
      background: linear-gradient(135deg, var(--pro-gold), #d97706);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 5rem 0 3rem;
    }

    .hero h1 {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.04em;
      margin-bottom: 1.2rem;
    }

    .hero h1 span {
      background: linear-gradient(135deg, #a5b4fc 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.15rem;
      max-width: 600px;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      gap: 1rem;
      max-width: 700px;
      margin: 0 auto 4rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      position: relative;
      min-width: 280px;
    }

    .search-box input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    /* Grid Display */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      padding-bottom: 5rem;
    }

    /* Modern Tilt Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 10px 30px -10px var(--primary-glow);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .model-tag {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 1.2rem;
    }

    /* Code Box inside card */
    .prompt-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 0.8rem;
      font-family: monospace;
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-bottom: 1.2rem;
      position: relative;
      max-height: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pro-metrics {
      display: none;
      background: rgba(245, 158, 11, 0.05);
      border: 1px dashed rgba(245, 158, 11, 0.3);
      border-radius: 8px;
      padding: 0.6rem;
      margin-bottom: 1.2rem;
      font-size: 0.78rem;
      color: #fef08a;
    }

    body.pro-mode-active .pro-metrics {
      display: flex;
      justify-content: space-between;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text);
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: white;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Effects -->
  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>

  <div class="container">
    <!-- Navbar -->
    <nav>
      <div class="logo">
        PROMPTIX <span class="badge-tag">NEXT-GEN</span>
      </div>
      <div class="mode-toggle">
        <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Costable Pro Mode</span>
        <label class="switch">
          <input type="checkbox" id="proToggle">
          <span class="slider"></span>
        </label>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
      <h1>Architectural AI Prompts<br><span>Elevated to Art</span></h1>
      <p>Discover, test, and optimize production-grade prompts engineered for LLMs, Midjourney, and Code Generation models.</p>
      
      <div class="controls-bar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search prompts by keyword, model, or task...">
        </div>
      </div>
    </section>

    <!-- Prompt Cards Grid -->
    <main class="grid" id="promptGrid">
      <!-- Cards rendered dynamically via JS -->
    </main>
  </div>

  <!-- Notification -->
  <div class="toast" id="toast">Prompt copied to clipboard!</div>

  <script>
    const promptsData = [
      {
        id: 1,
        title: "Photorealistic Cyberpunk City",
        model: "Midjourney v6",
        desc: "Generates high-detail architectural concept renders with volumetric neon lighting and rain reflections.",
        prompt: "/imagine prompt: Futuristic Tokyo alleyway, neon signage, wet asphalt reflection, cinematic lighting, 8k resolution, shot on 35mm --ar 16:9 --v 6.0",
        costPerRun: "$0.04",
        tokens: "~42 Tokens",
        efficiency: "98% Score"
      },
      {
        id: 2,
        title: "Full-Stack System Architect",
        model: "GPT-4o",
        desc: "Acts as a Principal Engineer to generate optimal system diagrams, DB schemas, and tech stacks.",
        prompt: "You are a Principal Software Architect. Design an ultra-scalable distributed event-driven architecture for e-commerce with low latency...",
        costPerRun: "$0.012",
        tokens: "~180 Tokens",
        efficiency: "95% Score"
      },
      {
        id: 3,
        title: "SaaS Landing Page Copywriter",
        model: "Claude 3.5 Sonnet",
        desc: "Crafts high-conversion hero sections, value propositions, and calls to action targeted at developer tools.",
        prompt: "Write landing page copy for a new developer telemetry tool. Focus on developer experience, 1-click integrations, and zero latency overhead...",
        costPerRun: "$0.008",
        tokens: "~120 Tokens",
        efficiency: "99% Score"
      },
      {
        id: 4,
        title: "3D Isometric Icon Engine",
        model: "DALL-E 3",
        desc: "Creates clean, claymation-style 3D icons on dark backgrounds for modern app UI/UX design.",
        prompt: "3D isometric render of a glowing blue cloud database icon, soft clay material, studio lighting, smooth gradients, dark background...",
        costPerRun: "$0.080",
        tokens: "~35 Tokens",
        efficiency: "91% Score"
      }
    ];

    const grid = document.getElementById('promptGrid');
    const searchInput = document.getElementById('searchInput');
    const proToggle = document.getElementById('proToggle');
    const toast = document.getElementById('toast');

    // Render Cards
    function renderCards(filter = '') {
      grid.innerHTML = '';
      const filtered = promptsData.filter(p => 
        p.title.toLowerCase().includes(filter.toLowerCase()) || 
        p.desc.toLowerCase().includes(filter.toLowerCase()) ||
        p.model.toLowerCase().includes(filter.toLowerCase())
      );

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="model-tag">${p.model}</span>
            </div>
            <h3 class="card-title">${p.title}</h3>
            <p class="card-desc">${p.desc}</p>
            
            <div class="pro-metrics">
              <span><strong>Est. Cost:</strong> ${p.costPerRun}</span>
              <span><strong>Tokens:</strong> ${p.tokens}</span>
              <span><strong>Rating:</strong> ${p.efficiency}</span>
            </div>

            <div class="prompt-box">${p.prompt}</div>
          </div>
          <div class="card-footer">
            <button class="btn copy-btn" onclick="copyPrompt('${encodeURIComponent(p.prompt)}')">Copy Prompt</button>
            <button class="btn" onclick="triggerToast('Prompt Sent to Playground!')">Test Live</button>
          </div>
        `;

        // Interactive 3D Tilt Effect
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateX = (y - centerY) / 15;
          const rotateY = (centerX - x) / 15;
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)';
        });

        grid.appendChild(card);
      });
    }

    // Toggle Pro Mode Metrics
    proToggle.addEventListener('change', (e) => {
      if(e.target.checked) {
        document.body.classList.add('pro-mode-active');
        triggerToast('Costable Pro Mode Enabled');
      } else {
        document.body.classList.remove('pro-mode-active');
      }
    });

    // Copy Action
    function copyPrompt(encodedText) {
      const text = decodeURIComponent(encodedText);
      navigator.clipboard.writeText(text);
      triggerToast('Copied to clipboard!');
    }

    // Toast Function
    function triggerToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Live Search
    searchInput.addEventListener('input', (e) => {
      renderCards(e.target.value);
    });

    // Initial Load
    renderCards();
  </script>
</body>
</html>
