
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PromptMall</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #111827;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       NAVBAR
    ========================= */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      height: 64px;
      border-bottom: 1px solid #e5e7eb;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .navbar-container {
      max-width: 1280px;
      height: 100%;
      margin: auto;
      padding: 0 32px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #ec4899
      );
    }

    .logo-icon i {
      width: 20px;
      height: 20px;
      color: white;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-gradient-text {
      background: linear-gradient(
        135deg,
        #7c3aed,
        #ec4899
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* =========================
       DESKTOP NAV
    ========================= */

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-link {
      padding: 8px 14px;
      border-radius: 999px;

      font-size: 14px;
      font-weight: 500;

      color: #6b7280;

      transition: 0.2s ease;
    }

    .nav-link:hover {
      color: #111827;
      background: #f3f4f6;
    }

    .nav-link.active {
      background: #f3f4f6;
      color: #111827;
    }

    /* =========================
       RIGHT ACTIONS
    ========================= */

    .right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* =========================
       SEARCH
    ========================= */

    .desktop-search {
      width: 224px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      height: 40px;

      border: 1px solid #e5e7eb;
      border-radius: 999px;

      padding: 0 40px 0 16px;

      outline: none;

      font-size: 14px;

      background: #ffffff;

      transition: 0.2s ease;
    }

    .search-box input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;

      transform: translateY(-50%);

      width: 17px;
      height: 17px;

      color: #9ca3af;
    }

    /* =========================
       ICON BUTTONS
    ========================= */

    .icon-button {
      width: 40px;
      height: 40px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 999px;

      color: #6b7280;

      transition: 0.2s ease;
    }

    .icon-button:hover {
      background: #f3f4f6;
      color: #111827;
    }

    .icon-button i {
      width: 20px;
      height: 20px;
    }

    .search-mobile {
      display: none;
    }

    /* =========================
       SUBMIT BUTTON
    ========================= */

    .submit-button {
      height: 36px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;

      padding: 0 16px;

      border: none;
      border-radius: 999px;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #ec4899
      );

      color: white;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .submit-button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .submit-button i {
      width: 16px;
      height: 16px;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-button {
      border: 1px solid #e5e7eb;
    }

    /* =========================
       THEME BUTTON
    ========================= */

    .theme-button {
      background: transparent;
      border: none;
      cursor: pointer;
    }

    /* =========================
       MOBILE MENU BUTTON
    ========================= */

    .mobile-menu-button {
      display: none;

      width: 40px;
      height: 40px;

      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 999px;

      background: transparent;

      color: #6b7280;

      cursor: pointer;
    }

    .mobile-menu-button:hover {
      background: #f3f4f6;
      color: #111827;
    }

    /* =========================
       MOBILE DRAWER
    ========================= */

    .mobile-overlay {
      position: fixed;
      inset: 0;

      z-index: 100;

      background: rgba(0, 0, 0, 0.35);

      opacity: 0;
      visibility: hidden;

      transition: 0.25s ease;
    }

    .mobile-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .mobile-menu {
      position: absolute;

      top: 0;
      right: 0;

      width: 100%;
      max-width: 360px;
      height: 100%;

      background: white;

      transform: translateX(100%);

      transition: 0.3s ease;

      display: flex;
      flex-direction: column;
    }

    .mobile-overlay.open .mobile-menu {
      transform: translateX(0);
    }

    /* =========================
       MOBILE HEADER
    ========================= */

    .mobile-header {
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      border-bottom: 1px solid #e5e7eb;
    }

    .mobile-logo {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 17px;
      font-weight: 700;
    }

    .mobile-logo-icon {
      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 9px;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #ec4899
      );
    }

    .mobile-logo-icon i {
      width: 16px;
      height: 16px;
      color: white;
    }

    .close-button {
      width: 36px;
      height: 36px;

      border: none;
      border-radius: 50%;

      background: transparent;

      cursor: pointer;
    }

    .close-button:hover {
      background: #f3f4f6;
    }

    /* =========================
       MOBILE NAV
    ========================= */

    .mobile-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;

      padding: 16px;
    }

    .mobile-nav-link {
      padding: 12px 16px;

      border-radius: 12px;

      font-size: 16px;
      font-weight: 500;

      color: #6b7280;

      transition: 0.2s ease;
    }

    .mobile-nav-link:hover,
    .mobile-nav-link.active {
      background: #f3f4f6;
      color: #111827;
    }

    /* =========================
       MOBILE ACTIONS
    ========================= */

    .mobile-actions {
      margin-top: auto;

      padding: 24px;

      border-top: 1px solid #e5e7eb;

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mobile-action {
      width: 100%;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      border-radius: 999px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .mobile-action i {
      width: 17px;
      height: 17px;
    }

    .outline-button {
      border: 1px solid #e5e7eb;
      background: white;
      color: #111827;
    }

    .primary-button {
      border: none;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #ec4899
      );

      color: white;
    }

    .ghost-button {
      border: none;
      background: transparent;
      color: #6b7280;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1199px) {
      .desktop-search {
        display: none;
      }

      .search-mobile {
        display: inline-flex;
      }
    }

    @media (max-width: 1023px) {
      .desktop-nav {
        display: none;
      }

      .mobile-menu-button {
        display: inline-flex;
      }
    }

    @media (max-width: 639px) {
      .navbar-container {
        padding: 0 16px;
      }

      .favorites-button,
      .submit-desktop,
      .profile-button {
        display: none;
      }

      .logo-text {
        font-size: 17px;
      }

      .right-actions {
        gap: 4px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       NAVBAR
  ========================== -->

  <header class="navbar">

    <div class="navbar-container">

      <!-- Logo -->
      <a href="/" class="logo">

        <div class="logo-icon">
          <i data-lucide="sparkles"></i>
        </div>

        <span class="logo-text">
          Prompt<span class="brand-gradient-text">Mall</span>
        </span>

      </a>


      <!-- Desktop Navigation -->
      <nav class="desktop-nav">

        <a href="/" class="nav-link active">
          Home
        </a>

        <a href="/explore" class="nav-link">
          Explore
        </a>

        <a href="/image-prompts" class="nav-link">
          Image Prompts
        </a>

        <a href="/video-prompts" class="nav-link">
          Video Prompts
        </a>

        <a href="/categories" class="nav-link">
          Categories
        </a>

      </nav>


      <!-- Right Actions -->
      <div class="right-actions">

        <!-- Desktop Search -->
        <div class="desktop-search">

          <form class="search-box" id="searchForm">

            <input
              type="text"
              id="searchInput"
              placeholder="Search..."
              aria-label="Search"
            >

            <i
              data-lucide="search"
              class="search-icon"
            ></i>

          </form>

        </div>


        <!-- Mobile Search -->
        <a
          href="/explore"
          class="icon-button search-mobile"
          aria-label="Search"
        >
          <i data-lucide="search"></i>
        </a>


        <!-- Favorites -->
        <a
          href="/favorites"
          class="icon-button favorites-button"
          aria-label="Favorites"
        >
          <i data-lucide="heart"></i>
        </a>


        <!-- Theme Toggle -->
        <button
          class="icon-button theme-button"
          id="themeToggle"
          aria-label="Toggle theme"
        >
          <i data-lucide="sun"></i>
        </button>


        <!-- Submit Prompt -->
        <a
          href="/submit"
          class="submit-desktop"
        >
          <button class="submit-button">

            <i data-lucide="plus"></i>

            Submit Prompt

          </button>
        </a>


        <!-- Profile -->
        <a
          href="/profile"
          class="icon-button profile-button"
          aria-label="Profile"
        >
          <i data-lucide="user"></i>
        </a>


        <!-- Mobile Menu -->
        <button
          class="mobile-menu-button"
          id="menuButton"
          aria-label="Open menu"
        >
          <i data-lucide="menu"></i>
        </button>

      </div>

    </div>

  </header>


  <!-- =========================
       MOBILE DRAWER
  ========================== -->

  <div
    class="mobile-overlay"
    id="mobileOverlay"
  >

    <div class="mobile-menu">

      <!-- Mobile Header -->
      <div class="mobile-header">

        <div class="mobile-logo">

          <div class="mobile-logo-icon">
            <i data-lucide="sparkles"></i>
          </div>

          <span>
            Prompt<span class="brand-gradient-text">Mall</span>
          </span>

        </div>

        <button
          class="close-button"
          id="closeMenu"
          aria-label="Close menu"
        >
          <i data-lucide="x"></i>
        </button>

      </div>


      <!-- Mobile Navigation -->
      <nav class="mobile-nav">

        <a href="/" class="mobile-nav-link active">
          Home
        </a>

        <a href="/explore" class="mobile-nav-link">
          Explore
        </a>

        <a href="/image-prompts" class="mobile-nav-link">
          Image Prompts
        </a>

        <a href="/video-prompts" class="mobile-nav-link">
          Video Prompts
        </a>

        <a href="/categories" class="mobile-nav-link">
          Categories
        </a>

      </nav>


      <!-- Mobile Actions -->
      <div class="mobile-actions">

        <a href="/favorites">

          <button class="mobile-action outline-button">
            <i data-lucide="heart"></i>
            Favorites
          </button>

        </a>


        <a href="/submit">

          <button class="mobile-action primary-button">
            <i data-lucide="plus"></i>
            Submit Prompt
          </button>

        </a>


        <a href="/profile">

          <button class="mobile-action ghost-button">
            <i data-lucide="user"></i>
            Profile
          </button>

        </a>

      </div>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    /* Initialize Lucide Icons */
    lucide.createIcons();


    /* =========================
       SEARCH
    ========================== */

    const searchForm =
      document.getElementById('searchForm');

    const searchInput =
      document.getElementById('searchInput');

    searchForm.addEventListener('submit', function(event) {

      event.preventDefault();

      const value =
        searchInput.value.trim();

      if (value) {

        window.location.href =
          '/explore?q=' +
          encodeURIComponent(value);

      }

    });


    /* =========================
       MOBILE MENU
    ========================== */

    const menuButton =
      document.getElementById('menuButton');

    const closeMenu =
      document.getElementById('closeMenu');

    const mobileOverlay =
      document.getElementById('mobileOverlay');


    function openMobileMenu() {

      mobileOverlay.classList.add('open');

      document.body.style.overflow = 'hidden';

    }


    function closeMobileMenu() {

      mobileOverlay.classList.remove('open');

      document.body.style.overflow = '';

    }


    menuButton.addEventListener(
      'click',
      openMobileMenu
    );


    closeMenu.addEventListener(
      'click',
      closeMobileMenu
    );


    /* Close when clicking outside drawer */

    mobileOverlay.addEventListener(
      'click',
      function(event) {

        if (event.target === mobileOverlay) {

          closeMobileMenu();

        }

      }
    );


    /* Close menu after clicking a link */

    document
      .querySelectorAll('.mobile-nav-link, .mobile-actions a')
      .forEach(function(link) {

        link.addEventListener(
          'click',
          closeMobileMenu
        );

      });


    /* =========================
       THEME TOGGLE
    ========================== */

    const themeToggle =
      document.getElementById('themeToggle');

    themeToggle.addEventListener(
      'click',
      function() {

        document.body.classList.toggle('dark');

      }
    );

  </script>

</body>
</html>
